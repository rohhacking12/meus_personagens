<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelie - Metodo Follett</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Georgia, 'Times New Roman', serif; background-color: #1a1a1a; color: #e5e5e5; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
        #bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; background-repeat: no-repeat; }
        #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: rgba(10,10,10,0.85); pointer-events: none; }
        
        .nav { background: #0a0a0a; border-bottom: 1px solid #1f2937; padding: 0; position: sticky; top: 0; z-index: 100; }
        .nav-inner { max-width: 80rem; margin: 0 auto; display: flex; align-items: center; padding: 0.75rem 1.5rem; }
        .nav-logo { height: 40px; width: auto; }
        .nav-title { color: #ca8a04; font-family: Georgia, serif; font-size: 1.5rem; font-weight: 800; margin-left: 1rem; letter-spacing: 0.05em; }

        header { background-color: #111827; border-bottom: 1px solid #1f2937; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: sticky; top: 48px; z-index: 50; }
        .header-inner { max-width: 80rem; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .header-inner h1 { font-size: 1.5rem; color: #ca8a04; letter-spacing: 0.05em; }
        .header-inner p { font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.1em; }
        .header-btns { display: flex; gap: 0.75rem; }
        .header-btns button { padding: 0.5rem 1rem; background: #1f2937; color: #e5e5e5; border: 1px solid #374151; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; font-weight: 500; transition: background 0.2s; }
        .header-btns button:hover { background: #374151; }

        main { flex-grow: 1; padding: 1.5rem; max-width: 80rem; margin: 0 auto; width: 100%; }

        .section-title { font-size: 1.5rem; color: #f3f4f6; margin-bottom: 1.5rem; }
        
        .search-bar { display: flex; gap: 0.75rem; margin-bottom: 2rem; align-items: center; flex-wrap: wrap; }
        .search-bar input { background: #1f2937; border: 1px solid #374151; color: #e5e5e5; border-radius: 0.5rem; padding: 0.5rem 1rem; flex: 1; min-width: 200px; }
        .search-bar input:focus { outline: none; border-color: #ca8a04; }
        .filter-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.4rem 0.8rem; background: #1f2937; border: 1px solid #374151; color: #9ca3af; border-radius: 0.375rem; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
        .filter-btn:hover { background: #374151; color: #e5e5e5; }
        .filter-btn.active { background: #ca8a04; color: #000; border-color: #ca8a04; font-weight: 600; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; padding-bottom: 2rem; }
        
        .card { background: rgba(20, 20, 25, 0.0000000005); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden; transition: all 0.3s ease; }
        .card:hover { background: rgba(31, 41, 55, 0.85); border-color: rgba(202,138,4,0.4); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
        .card-body { padding: 1.25rem; }
        .card-body { padding: 1.25rem; }
        .card-name { font-size: 1.25rem; color: #ca8a04; }
        .card-nick { font-size: 0.875rem; color: #9ca3af; margin-bottom: 1rem; font-style: italic; }
        .card-goal { font-size: 0.875rem; color: #d1d5db; margin-bottom: 1rem; }
        .card-actions { display: flex; gap: 0.5rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #374151; }
        .card-actions button { flex: 1; padding: 0.5rem; border-radius: 0.375rem; font-size: 0.875rem; border: none; cursor: pointer; transition: background 0.2s; }
        .btn-view { background: #374151; color: white; }
        .btn-view:hover { background: #4b5563; }
        .btn-edit { background: rgba(202,138,4,0.2); color: #ca8a04; }
        .btn-edit:hover { background: rgba(202,138,4,0.3); }
        .btn-del { background: rgba(220,38,38,0.2); color: #dc2626; }
        .btn-del:hover { background: rgba(220,38,38,0.3); }

        .btn-new-card { width: 100%; min-height: 12rem; border: 2px dashed #374151; border-radius: 0.75rem; background: rgba(17,24,39,0.5); color: #6b7280; cursor: pointer; font-size: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; transition: all 0.3s; }
        .btn-new-card:hover { color: #ca8a04; border-color: rgba(202,138,4,0.5); }
        .btn-new-card .plus { width: 3rem; height: 3rem; border-radius: 50%; border: 1px solid #374151; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; }

        .form-container { max-width: 48rem; margin: 0 auto; background: #1f2937; border-radius: 0.75rem; border: 1px solid #374151; overflow: hidden; }
        .form-header { background: #111827; padding: 1.5rem; border-bottom: 1px solid #374151; display: flex; justify-content: space-between; align-items: center; }
        .form-header h3 { font-size: 1.25rem; color: #ca8a04; }
        .form-header button { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1rem; }
        .form-header button:hover { color: white; }
        .form-body { padding: 2rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.35rem; font-size: 0.875rem; color: #9ca3af; }
        .form-group input, .form-group textarea { width: 100%; background: #111827; border: 1px solid #374151; color: #e5e5e5; border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #ca8a04; }
        .form-group textarea { resize: vertical; }
        .form-group select { width: 100%; background: #111827; border: 1px solid #374151; color: #e5e5e5; border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-family: inherit; cursor: pointer; }
        .form-group select:focus { outline: none; border-color: #ca8a04; }
        .form-group select option { background: #111827; color: #e5e5e5; }
        .form-section { border-top: 1px solid #374151; padding-top: 1.5rem; margin-top: 1.5rem; }
        .form-section h4 { font-size: 1.125rem; color: rgba(202,138,4,0.8); margin-bottom: 1rem; }
        .form-actions { display: flex; justify-content: flex-end; gap: 1rem; padding-top: 1.5rem; border-top: 1px solid #374151; margin-top: 2rem; }
        .form-actions button { padding: 0.5rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; border: none; transition: background 0.2s; }
        .btn-cancel { background: #374151; color: white; }
        .btn-cancel:hover { background: #4b5563; }
        .btn-save { background: #ca8a04; color: black; }
        .btn-save:hover { background: #e5a910; }

        .pdf-container { max-width: 48rem; margin: 0 auto; background: #1f2937; border-radius: 0.75rem; border: 1px solid #374151; overflow: hidden; }
        .pdf-body { padding: 2rem; background: #f3f4f6; color: #111827; min-height: 80vh; font-family: Georgia, serif; line-height: 1.6; }
        .pdf-body h1 { font-size: 1.875rem; margin-bottom: 0.5rem; color: #111827; }
        .pdf-body p { margin-bottom: 0.75rem; }
        .pdf-body strong { color: #374151; }
        .pdf-actions { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(0,0,0,0.1); display: flex; justify-content: flex-end; gap: 0.75rem; }
        .pdf-actions button { padding: 0.5rem 1.5rem; border-radius: 0.5rem; cursor: pointer; border: none; font-weight: bold; transition: background 0.2s; }
        .btn-pdf-back { background: #1f2937; color: white; }
        .btn-pdf-back:hover { background: #374151; }
        .btn-pdf-download { background: #b91c1c; color: white; }
        .btn-pdf-download:hover { background: #dc2626; }

        .empty-state { text-align: center; padding: 3rem; color: #6b7280; grid-column: 1 / -1; }
        .empty-state p { font-size: 1.125rem; }
        .empty-state small { font-size: 0.875rem; margin-top: 0.5rem; display: block; }

        .image-upload-area { border: 2px dashed #374151; border-radius: 0.5rem; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
        .image-upload-area:hover { border-color: #ca8a04; background: rgba(202,138,4,0.05); }
        .image-upload-area input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .image-upload-area .upload-icon { font-size: 2rem; color: #6b7280; margin-bottom: 0.5rem; }
        .image-upload-area .upload-text { color: #9ca3af; font-size: 0.875rem; }
        .image-preview-container { position: relative; display: inline-block; margin-top: 1rem; }
        .image-preview { max-width: 200px; max-height: 200px; border-radius: 0.5rem; border: 2px solid #374151; object-fit: cover; }
        .image-remove { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; background: #dc2626; color: white; border: none; border-radius: 50%; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; }
        .image-remove:hover { background: #b91c1c; }

        .card-image { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid #374151; }
        .card-image-placeholder { width: 100%; height: 160px; background: linear-gradient(135deg, #1f2937 0%, #374151 100%); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #374151; position: relative; }
        .card-image-placeholder span { color: #4b5563; font-size: 3rem; }

        .tag { position: absolute; top: 8px; right: 8px; font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 0.25rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; z-index: 2; }
        .tag-protagonista { background: rgba(202,138,4,0.85); color: #000; border: 1px solid rgba(202,138,4,1); }
        .tag-antagonista { background: rgba(220,38,38,0.85); color: #fff; border: 1px solid rgba(220,38,38,1); }
        .tag-secundario { background: rgba(59,130,246,0.85); color: #fff; border: 1px solid rgba(59,130,246,1); }
        .tag-co-protagonista { background: rgba(168,85,247,0.85); color: #fff; border: 1px solid rgba(168,85,247,1); }
        .tag-mentor { background: rgba(34,197,94,0.85); color: #000; border: 1px solid rgba(34,197,94,1); }
        .tag-aliado { background: rgba(20,184,166,0.85); color: #000; border: 1px solid rgba(20,184,166,1); }
        .tag-narrador { background: rgba(251,146,60,0.85); color: #000; border: 1px solid rgba(251,146,60,1); }
        .tag-outro { background: rgba(107,114,128,0.85); color: #fff; border: 1px solid rgba(107,114,128,1); }

        #themeSong-preview { background: #111827; border-radius: 0.5rem; padding: 1rem; border: 1px solid #374151; }
        #themeSong-embed iframe { border-radius: 0.5rem; }
        #themeSong-qr-img { background: white; padding: 0.25rem; }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .header-inner { flex-direction: column; gap: 1rem; }
            .search-bar { flex-direction: column; }
            .search-bar input { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <input type="file" id="bgInput" accept="image/*" style="display:none">

    <!-- NAV -->
    <nav class="nav">
        <div class="nav-inner">
            <img src="logo.png" alt="Logo" class="nav-logo" onerror="this.style.display='none'">
            <span class="nav-title">Ferramentas do Escritor</span>
        </div>
    </nav>

    <main>
        <!-- LISTA -->
        <section id="view-list">
            <h2 class="section-title">Meus personagens</h2>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar por nome...">
                <div class="filter-btns">
                    <button class="filter-btn active" data-filter="all">Todos</button>
                    <button class="filter-btn" data-filter="Protagonista">Protagonistas</button>
                    <button class="filter-btn" data-filter="Antagonista">Antagonistas</button>
                    <button class="filter-btn" data-filter="Secundario">Secundarios</button>
                </div>
            </div>
            <div id="characters-grid" class="grid"></div>
            <button class="btn-new-card" onclick="openForm()">
                <div class="plus">+</div>
                <span>Novo personagem</span>
            </button>
        </section>

        <!-- FORMULARIO -->
        <section id="view-form" style="display:none">
            <div class="form-container">
                <div class="form-header">
                    <h3 id="form-title">Novo Personagem</h3>
                    <button onclick="showView('list')">X Fechar</button>
                </div>
                <form id="characterForm" data-id="">
                    <div class="form-body">
                        <div class="form-section" style="border-top:none;padding-top:0;margin-top:0">
                            <h4>Tipo de Personagem</h4>
                            <div class="form-group">
                                <label for="role">Papel na Historia</label>
                                <select id="role" class="form-select">
                                    <option value="Protagonista">Protagonista</option>
                                    <option value="Antagonista">Antagonista</option>
                                    <option value="Secundario">Secundario</option>
                                    <option value="Co-protagonista">Co-protagonista</option>
                                    <option value="Mentor">Mentor</option>
                                    <option value="Aliado">Aliado</option>
                                    <option value="Narrador">Narrador</option>
                                    <option value="Outro">Outro</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-section">
                            <h4>Imagem do Personagem</h4>
                            <div class="form-group">
                                <div id="image-upload-area" class="image-upload-area">
                                    <div class="upload-icon">📷</div>
                                    <div class="upload-text">Clique ou arraste uma imagem aqui</div>
                                    <input type="file" id="imageInput" accept="image/*">
                                </div>
                                <div id="image-preview-container" class="image-preview-container" style="display:none">
                                    <img id="imagePreview" class="image-preview" alt="Preview">
                                    <button type="button" id="imageRemove" class="image-remove" title="Remover imagem">X</button>
                                </div>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="fullName">Nome Completo *</label>
                                <input type="text" id="fullName" required>
                            </div>
                            <div class="form-group">
                                <label for="nicknames">Apelidos / Codinomes</label>
                                <input type="text" id="nicknames">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="age">Idade Atual</label>
                                <input type="text" id="age" placeholder="Ex: 30 anos">
                            </div>
                            <div class="form-group">
                                <label for="birthDate">Data de Nascimento</label>
                                <input type="date" id="birthDate">
                            </div>
                        </div>
                        <div class="form-section">
                            <h4>Aparencia Fisica</h4>
                            <div class="form-group">
                                <label for="appearance">Biotipo, Estilo, Detalhes Fisicos</label>
                                <textarea id="appearance" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="form-section">
                            <h4>Psicologia e Personalidade</h4>
                            <div class="form-group">
                                <label for="psychology">Tracos positivos, negativos, temperamento</label>
                                <textarea id="psychology" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="form-section">
                            <h4>Motivacoes e Impulsos</h4>
                            <div class="form-group">
                                <label for="mainGoal">Objetivo Principal</label>
                                <input type="text" id="mainGoal">
                            </div>
                        </div>
                        <div class="form-section">
                            <h4>Arco Narrativo</h4>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="wants">O que ele QUER (Desejo)</label>
                                    <input type="text" id="wants">
                                </div>
                                <div class="form-group">
                                    <label for="needs">O que ele PRECISA (Necessidade)</label>
                                    <input type="text" id="needs">
                                </div>
                            </div>
                        </div>
                        <div class="form-section">
                            <h4>Extras</h4>
                            <div class="form-group">
                                <label for="themeSong">Musica Tema (Link do Spotify ou YouTube)</label>
                                <input type="text" id="themeSong" placeholder="Cole aqui o link do Spotify ou YouTube">
                                <div id="themeSong-preview" style="margin-top:0.75rem;display:none">
                                    <div id="themeSong-embed"></div>
                                    <div id="themeSong-qr" style="margin-top:0.75rem;text-align:center">
                                        <p style="font-size:0.75rem;color:#9ca3af;margin-bottom:0.5rem">QR Code do link:</p>
                                        <img id="themeSong-qr-img" style="width:120px;height:120px;border-radius:0.5rem;border:1px solid #374151" alt="QR Code">
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="moreInfo">Mais Informacoes</label>
                                <input type="text" id="moreInfo" placeholder="Detalhes extras sobre o personagem">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn-cancel" onclick="showView('list')">Cancelar</button>
                            <button type="submit" class="btn-save">Salvar Personagem</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <!-- PDF VIEW -->
        <section id="view-pdf" style="display:none">
            <div class="pdf-container">
                <div class="form-header">
                    <h3 id="view-pdf-title">Visualizacao</h3>
                    <button onclick="showView('list')">X Fechar</button>
                </div>
                <div class="pdf-body">
                    <div id="pdf-body"></div>
                    <div class="pdf-actions">
                        <button class="btn-pdf-back" onclick="showView('list')">Voltar</button>
                        <button id="btn-download-pdf" class="btn-pdf-download">Baixar PDF</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="console.error('Falha ao carregar jsPDF do CDN')"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            if (typeof window.jspdf === 'undefined' || !window.jspdf.jsPDF) {
                console.warn('jsPDF nao carregado via CDN. Tentando fallback...');
                var script = document.createElement('script');
                script.src = 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js';
                script.onerror = function() {
                    console.error('Falha ao carregar jsPDF de todos os CDNs.');
                };
                document.head.appendChild(script);
            } else {
                console.log('jsPDF carregado com sucesso');
            }
        });
    </script>
    <script src="storage.js"></script>
    <script src="pdf.js"></script>
    <script src="app.js"></script>
</body>
</html>
